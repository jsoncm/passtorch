<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>跨 Agent 中立记忆层 · 观测台（只读）</title>
    <style>
      :root {
        --bg: #0e1116;
        --panel: #161b22;
        --border: #2b333d;
        --text: #e6edf3;
        --muted: #8b949e;
        --accent: #4493f8;
        --claude: #d97757;
        --codex: #10a37f;
        --hit: #f2cc60;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 14px/1.6 -apple-system, "Segoe UI", "PingFang SC", sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      header {
        padding: 14px 20px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
      }
      header h1 { font-size: 16px; margin: 0; font-weight: 600; }
      .readonly-badge {
        font-size: 12px;
        color: var(--muted);
        border: 1px solid var(--border);
        padding: 2px 8px;
        border-radius: 10px;
      }
      .agents { margin-left: auto; display: flex; gap: 8px; align-items: center; }
      .chip {
        font-size: 12px;
        padding: 3px 10px;
        border-radius: 12px;
        border: 1px solid var(--border);
        color: var(--muted);
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
      .chip.active { color: var(--text); }
      .chip.active[data-agent="claude-code"] .dot { background: var(--claude); }
      .chip.active[data-agent="codex"] .dot { background: var(--codex); }
      main { display: grid; grid-template-columns: 340px 1fr; height: calc(100vh - 55px); }
      .col { overflow-y: auto; padding: 16px; }
      .col.left { border-right: 1px solid var(--border); }
      .col h2 {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        margin: 0 0 12px;
      }
      /* 左：调用流 */
      .call {
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        margin-bottom: 8px;
        background: var(--panel);
        font-size: 13px;
      }
      .call .who { font-weight: 600; }
      .call .who[data-agent="claude-code"] { color: var(--claude); }
      .call .who[data-agent="codex"] { color: var(--codex); }
      .call .op { color: var(--accent); }
      .call .op.recall { color: var(--hit); }
      .call .meta { color: var(--muted); font-size: 12px; }
      .call.flash { animation: flash 1s ease; }
      @keyframes flash { from { border-color: var(--accent); background: #1d2a3a; } }
      /* 右：记忆库 */
      .mem {
        border: 1px solid var(--border);
        border-radius: 10px;
        margin-bottom: 12px;
        background: var(--panel);
        overflow: hidden;
      }
      .mem.hit { outline: 2px solid var(--hit); }
      .mem summary {
        cursor: pointer;
        padding: 12px 14px;
        display: flex;
        gap: 10px;
        align-items: center;
        list-style: none;
      }
      .mem summary::-webkit-details-marker { display: none; }
      .mem .badge {
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 10px;
        border: 1px solid var(--border);
        color: var(--muted);
        white-space: nowrap;
      }
      .mem .badge[data-agent="claude-code"] { color: var(--claude); border-color: var(--claude); }
      .mem .badge[data-agent="codex"] { color: var(--codex); border-color: var(--codex); }
      .mem .sum { flex: 1; font-weight: 500; }
      .mem .fields { padding: 0 14px 14px; display: grid; gap: 8px; }
      .field { display: grid; grid-template-columns: 80px 1fr; gap: 10px; font-size: 13px; }
      .field .k { color: var(--muted); }
      .empty { color: var(--muted); padding: 20px; text-align: center; }
      .note {
        font-size: 12px;
        color: var(--muted);
        margin: 4px 0 14px;
        padding: 8px 10px;
        border-left: 2px solid var(--border);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>跨 Agent 中立记忆层 · 观测台</h1>
      <span class="readonly-badge">只读 · 记忆仅由 Agent 经 MCP 写入</span>
      <div class="agents" id="agents">
        <span class="chip" data-agent="claude-code"><span class="dot"></span>Claude Code</span>
        <span class="chip" data-agent="codex"><span class="dot"></span>Codex</span>
      </div>
    </header>
    <main>
      <section class="col left">
        <h2>调用流（Agent 在驱动）</h2>
        <div id="calls"><div class="empty">等待 Agent 调用…</div></div>
      </section>
      <section class="col right">
        <h2>共享记忆库</h2>
        <div class="note">
          人在旁观，Agent 在写。本页无任何新建 / 编辑 / 删除入口——记忆只能由 Agent 经 MCP
          <code>remember</code> 产生。
        </div>
        <div id="memories"><div class="empty">暂无记忆</div></div>
      </section>
    </main>

    <script>
      const memEl = document.getElementById('memories');
      const callEl = document.getElementById('calls');
      const memories = new Map(); // id -> entry
      const seenAgents = new Set();

      function esc(s) {
        return String(s ?? '').replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
      }
      function markAgent(agent) {
        if (!agent || seenAgents.has(agent)) return;
        seenAgents.add(agent);
        const chip = document.querySelector(`.chip[data-agent="${agent}"]`);
        if (chip) chip.classList.add('active');
      }
      function renderMemories(hitId) {
        if (memories.size === 0) {
          memEl.innerHTML = '<div class="empty">暂无记忆</div>';
          return;
        }
        const items = [...memories.values()].sort((a, b) => b.when.localeCompare(a.when));
        memEl.innerHTML = items
          .map(
            (m) => `
          <details class="mem ${m.id === hitId ? 'hit' : ''}" ${m.id === hitId ? 'open' : ''}>
            <summary>
              <span class="badge" data-agent="${esc(m.who)}">${esc(m.who)}</span>
              <span class="sum">${esc(m.summary)}</span>
            </summary>
            <div class="fields">
              <div class="field"><span class="k">who</span><span>${esc(m.who)}</span></div>
              <div class="field"><span class="k">when</span><span>${esc(m.when)}</span></div>
              <div class="field"><span class="k">intent</span><span>${esc(m.intent)}</span></div>
              <div class="field"><span class="k">evidence</span><span>${esc(m.evidence)}</span></div>
              <div class="field"><span class="k">project</span><span>${esc(m.project)}</span></div>
            </div>
          </details>`,
          )
          .join('');
      }
      function addCall(c, flash) {
        markAgent(c.agent);
        if (callEl.querySelector('.empty')) callEl.innerHTML = '';
        const div = document.createElement('div');
        div.className = 'call' + (flash ? ' flash' : '');
        const t = new Date(c.ts).toLocaleTimeString();
        div.innerHTML = `
          <span class="who" data-agent="${esc(c.agent)}">${esc(c.agent)}</span>
          <span class="op ${c.op}">${c.op}</span>
          <span class="meta"> · ${esc(c.queryOrIntent)}</span>
          <div class="meta">${t}${c.hitId ? ' · 命中 ' + esc(c.hitId) : ''}</div>`;
        callEl.prepend(div);
      }

      // 初始快照
      fetch('/entries')
        .then((r) => r.json())
        .then(({ memories: mem, calls }) => {
          mem.forEach((m) => memories.set(m.id, m));
          renderMemories();
          calls.forEach((c) => addCall(c, false));
        });

      // 实时流
      const es = new EventSource('/stream');
      es.addEventListener('memory', (e) => {
        const m = JSON.parse(e.data);
        memories.set(m.id, m);
        renderMemories();
      });
      es.addEventListener('call', (e) => {
        const c = JSON.parse(e.data);
        addCall(c, true);
        if (c.op === 'recall' && c.hitId) renderMemories(c.hitId);
      });
    </script>
  </body>
</html>
